name: Automated Transit Dataset Update

on:
  schedule:
    # Run every Sunday at 18:00 UTC (Monday 03:00 KST)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      update_polylines:
        description: 'Also update route polylines and station maps (TAGO API)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Bus Schedules (Wonju ITS)
        run: npm run data:schedule

      - name: Generate Route Polylines and Station Maps
        if: ${{ github.event_name == 'schedule' || inputs.update_polylines }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -n "$DATA_GO_KR_SERVICE_KEY" ]; then
            npm run data:polylines
          else
            echo "::warning::DATA_GO_KR_SERVICE_KEY is not configured in repository secrets. Skipping polyline generation."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage updated public files
          git add public/data/schedule.json public/schedule.json public/scheduleSummary.json \
                  public/routeMap.json public/stationMap.json public/routes/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No dataset changes detected. Everything is up to date."
          else
            echo "Changes detected, committing updated datasets..."
            git commit -m "chore(data): auto-update transit datasets [skip ci]"
            git push
          fi
